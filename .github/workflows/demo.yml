name: Demo на GitHub Pages

# Собирает демо без сервера (npm run build:demo) и кладёт его в ветку gh-pages.
# Адрес после включения Pages: https://<владелец>.github.io/<репозиторий>/
on:
  push:
    branches: [main, claude/optimistic-edison-ldty0p]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: demo
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build:demo -w @spectr/web
      - name: Публикация в ветку gh-pages
        working-directory: apps/web/dist-demo
        run: |
          touch .nojekyll
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Demo: ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" gh-pages
